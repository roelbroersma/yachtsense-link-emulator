name: Publish v1.0.11 release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.0.11.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      - name: Validate package lifecycle scripts
        run: |
          sh -n package/control/prerm
          sh -n package/control/postrm
          grep -Fq 'PKG_UPGRADE' package/control/prerm
          grep -Fq 'PKG_UPGRADE' package/control/postrm

      - name: Validate and build RutOS packages
        run: make check

      - name: Publish WebUI packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.11
          VERSION: 1.0.11
        run: |
          set -euo pipefail

          STABLE="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.1.tar.gz"
          LATEST="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.2.tar.gz"

          NOTES=$(cat <<EOF
          WebUI installation packages for Teltonika RUTX routers.

          - RutOS RUTX_R_00.07.24.1: ${STABLE}
          - RutOS RUTX_R_00.07.24.2: ${LATEST}

          This release fixes in-place upgrades from an already installed YachtSense Link Emulator package.

          Upload the file matching your installed firmware via:
          System → Package Manager → Upload package
          EOF
          )

          gh release create "$TAG" \
            "dist/$STABLE" \
            "dist/$LATEST" \
            --target "$GITHUB_SHA" \
            --title "YachtSense Link Emulator $TAG" \
            --notes "$NOTES"
