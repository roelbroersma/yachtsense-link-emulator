name: Research Raymarine APK

on:
  push:
    branches: ["research-raymarine-apk"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Raymarine Android app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research/download
          cd research/download
          # APKPure's direct endpoint normally returns the latest XAPK for a package.
          if ! curl -fL --retry 3 --retry-delay 3 -A 'Mozilla/5.0' \
            'https://d.apkpure.com/b/XAPK/com.raymarine.rayconnect?version=latest' \
            -o raymarine.xapk; then
            # Fallback to the publicly mirrored 2.3.13 arm64 split bundle.
            curl -fL --retry 3 --retry-delay 3 -A 'Mozilla/5.0' \
              'https://apk.dog/download?split=474663%2F3414916%2Frayconnect-by-raymarine' \
              -o raymarine.xapk
          fi
          ls -lh raymarine.xapk
          file raymarine.xapk
          unzip -t raymarine.xapk | tail -n 5

      - name: Extract bundle and identify APKs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research/xapk research/report
          unzip -q research/download/raymarine.xapk -d research/xapk
          find research/xapk -type f -name '*.apk' -printf '%p\n' | sort | tee research/report/apks.txt
          BASE="$(find research/xapk -type f \( -name 'base.apk' -o -name 'com.raymarine.rayconnect.apk' \) | head -n1)"
          if [ -z "$BASE" ]; then
            BASE="$(find research/xapk -type f -name '*.apk' | head -n1)"
          fi
          test -n "$BASE"
          echo "$BASE" | tee research/report/base-apk.txt
          sha256sum research/download/raymarine.xapk "$BASE" | tee research/report/sha256.txt

      - name: Install JADX
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            'https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip' \
            -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version

      - name: Decompile application
        shell: bash
        run: |
          set -euxo pipefail
          BASE="$(cat research/report/base-apk.txt)"
          mkdir -p research/jadx
          /tmp/jadx/bin/jadx -j 4 --no-res --show-bad-code -d research/jadx "$BASE" || true
          find research/jadx -type f | wc -l | tee research/report/jadx-file-count.txt

      - name: Extract native libraries and resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research/unpacked
          i=0
          while IFS= read -r apk; do
            i=$((i+1))
            mkdir -p "research/unpacked/$i"
            unzip -q -o "$apk" -d "research/unpacked/$i" || true
          done < research/report/apks.txt
          find research/unpacked -type f -name '*.so' -printf '%p\n' | sort | tee research/report/native-libs.txt

      - name: Search discovery and mirroring implementation
        shell: bash
        run: |
          set -euxo pipefail
          PATTERN='YachtSense|Yachtsense|yachtsense|MFD|mfd|NsdManager|DnsSd|DNS-SD|mDNS|mdns|Bonjour|zeroconf|_http\._tcp|_ray|RayNet|multicast|Multicast|224\.0\.0\.251|5353|7777|VNC|vnc|RFB|rfb|RTSP|rtsp|mirror|Mirror|screen.?stream|streaming|5900|5901|discover|Discovery|serviceFound|DatagramSocket|MulticastSocket|NetworkInterface|WifiManager'
          {
            echo '=== JADX SOURCE HITS ==='
            grep -RniE --binary-files=without-match "$PATTERN" research/jadx 2>/dev/null | head -n 12000 || true
            echo
            echo '=== RESOURCE / CONFIG HITS ==='
            grep -RniE --binary-files=without-match "$PATTERN" research/unpacked 2>/dev/null | head -n 12000 || true
          } > research/report/interesting.txt

          echo '=== NATIVE STRING HITS ===' > research/report/native-strings.txt
          while IFS= read -r so; do
            echo "--- $so ---" >> research/report/native-strings.txt
            strings -a "$so" | grep -iE 'yachtsense|raymarine|mfd|mdns|dns.?sd|bonjour|zeroconf|_http\._tcp|multicast|224\.0\.0\.251|5353|7777|vnc|rfb|rtsp|mirror|stream|5900|5901|discov' \
              | sort -u | head -n 2000 >> research/report/native-strings.txt || true
          done < research/report/native-libs.txt

      - name: Collect likely implementation files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research/selected
          grep -RilE --binary-files=without-match \
            'YachtSense|NsdManager|DnsSd|mDNS|_http\._tcp|VNC|RFB|RTSP|mirror|screen.?stream|MulticastSocket|DatagramSocket' \
            research/jadx 2>/dev/null | head -n 300 > research/report/selected-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            rel="${f#research/jadx/}"
            mkdir -p "research/selected/$(dirname "$rel")"
            cp "$f" "research/selected/$rel"
          done < research/report/selected-files.txt
          tar -czf research/raymarine-selected-sources.tar.gz -C research selected report

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: raymarine-apk-analysis
          path: |
            research/report/**
            research/raymarine-selected-sources.tar.gz
          retention-days: 3
