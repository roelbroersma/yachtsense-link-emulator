name: Publish v1.0.0 release

# One-shot release workflow. The path filter means normal future commits do not
# republish v1.0.0 unless this workflow file itself is changed.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.0.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      - name: Validate and build IPK
        run: make check

      - name: Build source archive
        run: make source

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.ipk dist/*.sha256 dist/*.tar.gz --clobber
          else
            gh release create "$TAG" \
              dist/*.ipk dist/*.sha256 dist/*.tar.gz \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "YachtSense Link Emulator $TAG"
          fi
