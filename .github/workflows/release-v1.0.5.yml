name: Publish v1.0.5 release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.0.5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      - name: Validate new Lua and VuCI files
        run: |
          luac -p package/root/usr/lib/lua/api/services/yachtsense_link_emulator_save_v105.lua
          luac -p package/root/usr/lib/lua/api/services/yachtsense_link_emulator_control_v105.lua
          node --check package/root/www/views/services/YachtSenseLinkEmulatorV105.js

      - name: Validate and build RutOS packages
        run: make check

      - name: Publish simple WebUI release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.5
          VERSION: 1.0.5
        run: |
          set -euo pipefail

          STABLE="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.1.tar.gz"
          LATEST="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.2.tar.gz"

          NOTES=$(cat <<EOF
          WebUI installation packages for Teltonika RUTX routers.

          - RutOS RUTX_R_00.07.24.1: ${STABLE}
          - RutOS RUTX_R_00.07.24.2: ${LATEST}

          Upload the file matching your installed firmware via:
          System → Package Manager → Upload package

          The package is third-party software, so RutOS may show an Unauthorized file warning; choose Install anyway.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Keep the release uncluttered: only the two WebUI-installable wrappers.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              case "$asset" in
                "$STABLE"|"$LATEST") ;;
                *) gh release delete-asset "$TAG" "$asset" -y || true ;;
              esac
            done

            gh release upload "$TAG" \
              "dist/$STABLE" \
              "dist/$LATEST" \
              --clobber
            gh release edit "$TAG" \
              --title "YachtSense Link Emulator $TAG" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              "dist/$STABLE" \
              "dist/$LATEST" \
              --target "$GITHUB_SHA" \
              --title "YachtSense Link Emulator $TAG" \
              --notes "$NOTES"
          fi
