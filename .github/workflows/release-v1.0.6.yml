name: Publish v1.0.6 release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.0.6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      - name: Validate v1.0.6 files
        run: |
          luac -p package/root/usr/lib/lua/api/services/yachtsense_link_emulator_save_v106.lua
          luac -p package/root/usr/lib/lua/api/services/yachtsense_link_emulator_control_v106.lua
          node --check package/root/www/views/services/YachtSenseLinkEmulatorV106.js

      - name: Build RutOS packages
        run: make check

      - name: Publish WebUI packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.6
          VERSION: 1.0.6
        run: |
          set -euo pipefail
          STABLE="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.1.tar.gz"
          LATEST="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.2.tar.gz"

          NOTES=$(cat <<EOF
          Teltonika RUTX WebUI installation packages:

          - RutOS 7.24.1: ${STABLE}
          - RutOS 7.24.2: ${LATEST}

          Upload the matching file via System → Package Manager → Upload package.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              case "$asset" in
                "$STABLE"|"$LATEST") ;;
                *) gh release delete-asset "$TAG" "$asset" -y || true ;;
              esac
            done
            gh release upload "$TAG" "dist/$STABLE" "dist/$LATEST" --clobber
            gh release edit "$TAG" --title "YachtSense Link Emulator $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              "dist/$STABLE" \
              "dist/$LATEST" \
              --target "$GITHUB_SHA" \
              --title "YachtSense Link Emulator $TAG" \
              --notes "$NOTES"
          fi
