name: Test and release YachtSense Link Emulator

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yachtsense-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y luajit
      - name: Test source, build ARM package and verify its contents
        env:
          LUA_TEST: luajit
        run: bash scripts/check.sh
      - name: Publish the WebUI package and CLI alternative
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "v$version" \
            "dist/yachtsense-link-emulator_${version}-1_RUTX_00.07.25.3.tar.gz" \
            "build/tlt_custom_pkg_yachtsense-link-emulator_${version}-1_cortexa7hf-neon-vfpv4.ipk" \
            --target "$GITHUB_SHA" \
            --title "YachtSense Link Emulator $version — RUTX14 / RutOS 7.25.3" \
            --notes-file RELEASE.md --latest
