name: Build RutOS package

# Validate every change, build downloadable artifacts and publish semantic tags.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      # make check builds and validates the generic RUTX IPK plus the current
      # Stable/Latest WebUI wrappers.
      - name: Validate and build package
        run: make check

      - name: Build source archive
        run: make source

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yachtsense-link-emulator-${{ github.sha }}
          path: |
            dist/*.ipk
            dist/*.sha256
            dist/*.tar.gz
          retention-days: 14

      # Normal releases are tag driven. The single release-v1.0.0 PR is also
      # allowed to refresh the first release with the corrected RutOS artifacts.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.head_ref == 'release-v1.0.0')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v1.0.0"
          fi

          notes=$'YachtSense Link Emulator for Teltonika RUTX / RutOS 7.\n\nDownloads:\n- Generic RUTX IPK: firmware-independent, for SSH/opkg.\n- RutOS 7.24.1 WebUI bundle: current Stable firmware.\n- RutOS 7.24.2 WebUI bundle: current Latest firmware.\n\nThe two WebUI bundles contain the same generic IPK; only the Teltonika Package Manager Firmware metadata differs.'

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/*.ipk dist/*.sha256 dist/*.tar.gz \
              --clobber
            gh release edit "$tag" \
              --title "YachtSense Link Emulator $tag" \
              --notes "$notes"
          else
            gh release create "$tag" \
              dist/*.ipk dist/*.sha256 dist/*.tar.gz \
              --target main \
              --title "YachtSense Link Emulator $tag" \
              --notes "$notes"
          fi
