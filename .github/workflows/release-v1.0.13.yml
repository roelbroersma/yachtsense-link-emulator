name: Publish v1.0.13 release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.0.13.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      - name: Validate simplified VuCI UI
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.13"
          node --check package/root/www/views/services/YachtSenseLinkEmulatorV113.js
          test -s package/root/www/assets/yachtsense-link-emulator-v113.css
          jq -e '."services/yachtsense-link-emulator".view == "services/YachtSenseLinkEmulatorV113"' \
            package/root/usr/share/vuci/menu.d/yachtsense-link-emulator.json >/dev/null
          grep -Fq "option manage_ip '0'" package/root/etc/config/yachtsense_link_emulator
          grep -Fq "option remove_ip_on_stop '0'" package/root/etc/config/yachtsense_link_emulator

      - name: Validate and build RutOS packages
        run: make check

      - name: Publish WebUI packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.13
          VERSION: 1.0.13
        run: |
          set -euo pipefail

          STABLE="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.1.tar.gz"
          LATEST="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.2.tar.gz"

          NOTES=$(cat <<EOF
          Status-first YachtSense Link Emulator UI.

          Main changes:
          - one clear overall status with checks for service, RayNet, Axiom, app network and discovery
          - RayNet interface is detected from the existing 198.18.0.1/21 address instead of adding an address by default
          - automatic app-network recommendation with manual override only under Change…
          - Discovery is presented as Automatic / Built-in daemon / Existing Avahi reflector
          - Advanced and Diagnostics are collapsed by default; logs live only under Diagnostics
          - Save changes appears only when something was changed
          - clean installs no longer manage or remove the RayNet IP unless explicitly enabled under Advanced

          - RutOS RUTX_R_00.07.24.1: ${STABLE}
          - RutOS RUTX_R_00.07.24.2: ${LATEST}

          Upload the file matching your installed firmware via:
          System → Package Manager → Upload package
          EOF
          )

          gh release create "$TAG" \
            "dist/$STABLE" \
            "dist/$LATEST" \
            --target "$GITHUB_SHA" \
            --title "YachtSense Link Emulator $TAG" \
            --notes "$NOTES"
