name: Raymarine app protocol research

# Temporary PR-only research workflow. It decompiles the known downloadable
# Raymarine Android build and prints only focused protocol evidence to the job
# log. No APK or proprietary decompiled source is committed to main.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ github.head_ref == 'research-raymarine-apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Download and decompile Raymarine 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raymarine
          curl -fL --retry 3 --retry-delay 3 -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/APK/com.raymarine.rayconnect?nc=arm64-v8a%2Carmeabi-v7a%2Cx86%2Cx86_64&sv=26&versionCode=528' \
            -o /tmp/raymarine/raymarine.apk
          echo "APK SHA256: $(sha256sum /tmp/raymarine/raymarine.apk | cut -d' ' -f1)"
          curl -fL --retry 3 \
            'https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip' \
            -o /tmp/raymarine/jadx.zip
          unzip -q /tmp/raymarine/jadx.zip -d /tmp/raymarine/jadx-bin
          /tmp/raymarine/jadx-bin/bin/jadx -j 4 --no-res --show-bad-code \
            -d /tmp/raymarine/jadx /tmp/raymarine/raymarine.apk || true

      - name: Print exact discovery and remote-control evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/raymarine/jadx/sources/com/raymarine/rayconnect

          echo '=== Raymarine NSD / MFD discovery classes ==='
          find "$ROOT" -type f \( \
            -name 'NsdHardwareSearchDriver.java' -o \
            -name 'NsdDiscoveryExecutor.java' -o \
            -name 'NsdDiscoveryListener.java' -o \
            -name 'NetworkHardwareSearchDriver.java' \
          \) -print

          echo '=== Discovery constants and calls ==='
          grep -RniE -C 8 --include='*.java' \
            'discoverServices|resolveService|getServiceType|getServiceName|getHost|getPort|NsdManager|SERVICE_TYPE|_tcp|_udp' \
            "$ROOT/device/mfd" | head -n 1600 || true

          echo '=== RayView / RTSP / GStreamer evidence ==='
          grep -RniE -C 8 --include='*.java' \
            'rtsp://|rtspsrc|GStreamer|pipeline|video|stream|RayView|RayControl|controlDriver|setMfd|connect' \
            "$ROOT/modules/mfd/rayview" "$ROOT/rayview" "$ROOT/device/mfd/control" \
            | head -n 2200 || true

          echo '=== Interesting quoted literals ==='
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('/tmp/raymarine/jadx/sources/com/raymarine/rayconnect')
          bases=[root/'device/mfd',root/'modules/mfd/rayview',root/'rayview',root/'domain/hardware',root/'domain/boat']
          rx=re.compile(r'(?i)(_tcp|_udp|rtsp|rtspsrc|gst|socket|port|discover|rayview|raycontrol|mfd|yachtsense|cloudconnector|websocket|198\.18\.|224\.0\.0\.251|5353|7777|5900|554)')
          for base in bases:
              if not base.exists(): continue
              for p in sorted(base.rglob('*.java')):
                  vals=[]
                  for s in re.findall(r'"((?:\\.|[^"\\])*)"',p.read_text(errors='ignore')):
                      if rx.search(s) and s not in vals: vals.append(s)
                  if vals:
                      print('FILE',p.relative_to(root))
                      for s in vals: print('  LITERAL',s)
          PY

          echo '=== Native Raymarine transport strings ==='
          mkdir -p /tmp/raymarine/native
          unzip -q -o /tmp/raymarine/raymarine.apk 'lib/armeabi-v7a/*' -d /tmp/raymarine/native
          for so in libRayDBRemoteClient.so librrccpp.so libraydb.so libownerrequest.so libgstreamer_android.so; do
            f="/tmp/raymarine/native/lib/armeabi-v7a/$so"
            [ -f "$f" ] || continue
            echo "--- $so ---"
            strings -a -n 4 "$f" | grep -iE \
              'raymarine|mfd|rayview|raycontrol|rtsp|rtspsrc|tcp|udp|socket|port|discover|websocket|http|198\.18\.|224\.0\.0\.251|5353|7777|5900|554' \
              | sort -u | head -n 800 || true
          done
