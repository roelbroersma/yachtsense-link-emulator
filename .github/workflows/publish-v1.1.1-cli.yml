name: Publish identical v1.1.1 CLI diagnostic package

on:
  push:
    branches: ["release/1.1.1-rutos-7.25.3"]
    paths:
      - ".github/workflows/publish-v1.1.1-cli.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-yachtsense-v1.1.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the release source snapshot
        uses: actions/checkout@v4

      - name: Use the original Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
          cache: false

      - name: Use the original Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Verify source and rebuild without changing the package
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.1.1"
          go version
          python3 -c 'import zlib; print("zlib", zlib.ZLIB_VERSION, zlib.ZLIB_RUNTIME_VERSION)'
          go vet ./...
          node --check --input-type=module < package/root/www/views/services/YachtSenseLinkEmulatorV1100.js
          sh -n package/root/etc/init.d/yachtsense-link-emulator
          for script in package/control/*; do sh -n "$script"; done
          python3 scripts/build.py --firmware RUTX_R_00.07.25.3

      - name: Require byte identity with the original user-tested package
        shell: bash
        run: |
          set -euo pipefail
          echo '83dd11db0664a1343ead8f45da541bff73f6caa9935632617adfa321a07deb7a  build/tlt_custom_pkg_yachtsense-link-emulator_1.1.1-1_cortexa7hf-neon-vfpv4.ipk' | sha256sum -c -
          echo '02158231c94a6193e57a3fcfa840827c98525510fa1b50b4a520542c74efece3  dist/yachtsense-link-emulator_1.1.1-1_RUTX_00.07.25.3.tar.gz' | sha256sum -c -

      - name: Publish only the CLI IPK and WebUI wrapper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.1 \
            build/tlt_custom_pkg_yachtsense-link-emulator_1.1.1-1_cortexa7hf-neon-vfpv4.ipk \
            dist/yachtsense-link-emulator_1.1.1-1_RUTX_00.07.25.3.tar.gz \
            --target "$GITHUB_SHA" \
            --title 'YachtSense Link Emulator 1.1.1 — RutOS 7.25.3 (CLI diagnostic)' \
            --notes-file RELEASE.md \
            --prerelease \
            --latest=false
