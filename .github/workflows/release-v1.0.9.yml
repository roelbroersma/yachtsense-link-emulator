name: Publish v1.0.9 release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.0.9.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      - name: Validate v1.0.9 files
        run: |
          luac -p package/root/usr/lib/lua/api/services/yachtsense_link_emulator_status_v109.lua
          luac -p package/root/usr/lib/lua/api/services/yachtsense_link_emulator_save_v109.lua
          luac -p package/root/usr/lib/lua/api/services/yachtsense_link_emulator_control_v109.lua
          node --check package/root/www/views/services/YachtSenseLinkEmulatorV109.js
          sh -n package/root/etc/init.d/yachtsense-link-emulator
          jq empty package/root/usr/share/vuci/path.d/yachtsense-link-emulator.json
          jq empty package/root/usr/share/vuci/menu.d/yachtsense-link-emulator.json
          jq empty package/root/usr/share/rpcd/acl.d/yachtsense-link-emulator.json

      - name: Validate and build RutOS packages
        run: make check

      - name: Publish WebUI packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.9
          VERSION: 1.0.9
        run: |
          set -euo pipefail

          STABLE="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.1.tar.gz"
          LATEST="yachtsense-link-emulator_${VERSION}-1_RUTX_00.07.24.2.tar.gz"

          NOTES=$(cat <<EOF
          WebUI installation packages for Teltonika RUTX routers.

          - RutOS RUTX_R_00.07.24.1: ${STABLE}
          - RutOS RUTX_R_00.07.24.2: ${LATEST}

          Upload the file matching your installed firmware via:
          System → Package Manager → Upload package
          EOF
          )

          gh release create "$TAG" \
            "dist/$STABLE" \
            "dist/$LATEST" \
            --target "$GITHUB_SHA" \
            --title "YachtSense Link Emulator $TAG" \
            --notes "$NOTES"
