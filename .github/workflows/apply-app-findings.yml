name: Apply verified Raymarine app findings

# One-shot maintenance workflow kept on the research branch. It updates only
# public interoperability facts/defaults on main and runs the full package test.
on:
  push:
    branches: ["research-raymarine-apk"]
    paths:
      - .github/workflows/apply-app-findings.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lua5.1

      - name: Apply exact YachtSense identity and README findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('package/root/etc/config/yachtsense_link_emulator'),
              Path('package/root/etc/init.d/yachtsense-link-emulator'),
              Path('package/root/usr/lib/lua/api/services/yachtsense_link_emulator.lua'),
              Path('package/root/www/views/services/YachtSenseLinkEmulator.js'),
              Path('cmd/yachtsense-link-emulator/main.go'),
              Path('cmd/yachtsense-link-emulator/main_test.go'),
          ]
          for path in files:
              text = path.read_text()
              # Change only quoted default values; package/API paths such as
              # yachtsense-link-emulator must remain untouched.
              text = text.replace('"yachtsense-link"', '"yachtsense-main"')
              text = text.replace("'yachtsense-link'", "'yachtsense-main'")
              text = text.replace('YachtSense Link Settings', 'yachtsense-main Settings')
              path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('Hostname:         yachtsense-link\n', 'Hostname:         yachtsense-main\n')
          text = text.replace('Service instance: YachtSense Link Settings\n', 'Service instance: yachtsense-main Settings\n')

          mobile = '''### Raymarine mobile app and screen mirroring

The Raymarine mobile app uses **Android NSD / mDNS directly to discover the MFD**. Current app analysis (Raymarine Android 2.3.16) shows that it browses these DNS-SD service types:

- `_rtsp._tcp` — MFD screen-stream discovery;
- `_rym_rrc._tcp` — Raymarine remote-control discovery;
- `_raydb._tcp` — Raymarine database/device service;
- `_http._tcp` — onboard devices including YachtSense Link;
- `_services._dns-sd._udp` — generic DNS-SD enumeration.

Screen mirroring is therefore **not proxied through YachtSense Link**. Once the phone has discovered the Axiom and can route to its IP address, the app opens the MFD stream directly:

```text
rtsp://<Axiom-IP>:8554/RAYMARINEMFD
```

The app's current remote-control implementation defines these ports:

| Port | Meaning in the Raymarine app |
|---|---|
| `8554/TCP` | View-only / RTSP screen stream |
| `50000/TCP` | Touch-capable remote-control socket |
| `49111` | `DISABLE_PORT` state used by MFD discovery |

Touch events carry a touch ID, a state (`down`, `moved`, `up`) and normalized X/Y coordinates. The control client connects directly to the MFD on TCP port `50000`.

For a phone connected to a Teltonika Wi-Fi network, this means the Axiom does **not** have to be the phone's Wi-Fi access point. The phone needs:

1. mDNS visibility to the Axiom (`224.0.0.251:5353/UDP`);
2. IP reachability to the Axiom;
3. access to TCP `8554` and TCP `50000`.

If Wi-Fi and the Axiom Ethernet port are members of the same bridge/broadcast domain, ordinary mDNS is sufficient. If they are separated by VLANs or routed interfaces, an mDNS reflector/repeater and normal unicast routing are required.

The current Raymarine app also classifies an `_http._tcp` onboard device as a YachtSense Link when its service name contains **`yachtsense-main`** (legacy builds also accept `imx8mmevk`). The real YachtSense firmware uses hostname `yachtsense-main`, so this emulator now uses **`yachtsense-main`** and **`yachtsense-main Settings`** as its defaults as well.

'''
          marker = '## Networking\n'
          if '### Raymarine mobile app and screen mirroring\n' not in text:
              if marker not in text:
                  raise SystemExit('README networking marker not found')
              text = text.replace(marker, mobile + marker, 1)

          # Add the MFD-side ports to the existing overview without implying
          # that the emulator listens on them.
          old = '| DNS-SD SRV value | TCP `80` | Discovery metadata only |\n'
          new = old + '| Axiom RTSP | `<Axiom IP>:8554/TCP` | Screen mirroring (MFD service, not emulator) |\n| Axiom control | `<Axiom IP>:50000/TCP` | Touch/remote control (MFD service, not emulator) |\n'
          if old in text and '| Axiom RTSP |' not in text:
              text = text.replace(old, new, 1)

          readme.write_text(text)
          PY

      - name: Validate package
        run: make check

      - name: Commit verified findings to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md cmd package
          git commit -m 'Document Raymarine app discovery and use official YachtSense hostname' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
